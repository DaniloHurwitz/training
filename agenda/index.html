<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f5f2">
  <meta name="description" content="Panel personal de organización semanal: trabajo, facultad, ingresos y cobros. Funciona 100% en el navegador.">
  <title>Agenda semanal</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231d1c1a'/%3E%3Crect x='6' y='17' width='20' height='3' rx='1.5' fill='%23e5383b'/%3E%3C/svg%3E">
  <script>
    /* Aplica el tema antes de pintar para evitar un destello */
    (function () {
      try {
        var d = JSON.parse(localStorage.getItem('agendaSemanal:data:v1') || '{}');
        var t = (d.settings && d.settings.theme) || 'system';
        var r = t === 'system' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : t;
        document.documentElement.setAttribute('data-theme-resolved', r);
      } catch (e) { /* sin almacenamiento */ }
    })();
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-section="calendar">
  <!-- Íconos (trazos simples, 24×24) -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2.5"/><path d="M16 2.5v3.5M8 2.5v3.5M3 10h18"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M18 20V10M12 20V4M6 20v-6"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
    <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></symbol>
    <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M19 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-3"/><path d="M21 8h-5a4 4 0 0 0 0 8h5z"/><path d="M16 12h.01"/></symbol>
    <symbol id="i-exchange" viewBox="0 0 24 24"><path d="M4 8h15l-4-4M20 16H5l4 4"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-filter" viewBox="0 0 24 24"><path d="M3 5h18M6 12h12M10 19h4"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18h2"/></symbol>
    <symbol id="i-laptop" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="11" rx="1.5"/><path d="M2 19h20"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></symbol>
    <symbol id="i-printer" viewBox="0 0 24 24"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-cap" viewBox="0 0 24 24"><path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/></symbol>
    <symbol id="i-briefcase" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></symbol>
    <symbol id="i-bars" viewBox="0 0 24 24"><path d="M3 6h12M3 12h18M3 18h8"/></symbol>
    <symbol id="i-pie" viewBox="0 0 24 24"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></symbol>
    <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3M12 17h.01"/></symbol>
    <symbol id="i-walk" viewBox="0 0 24 24"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h8a3 3 0 0 0 0-6H8a3 3 0 0 1 0-6h8"/></symbol>
    <symbol id="i-arrows" viewBox="0 0 24 24"><path d="M3 12h6M6 9l3 3-3 3M21 12h-6M18 9l-3 3 3 3"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></symbol>
    <symbol id="i-table" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/></symbol>
    <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M15 3v18"/></symbol>
    <symbol id="i-zoom-in" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M11 8v6M8 11h6"/></symbol>
    <symbol id="i-zoom-out" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M8 11h6"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
    <symbol id="i-keyboard" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
  </svg>

  <div class="app">
    <aside class="sidebar" aria-label="Navegación principal">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span><div><b>Agenda</b> <span id="brandName" class="muted"></span></div></div>
      <nav class="nav">
        <button data-section="calendar"><svg class="ic"><use href="#i-calendar"/></svg><span>Calendario</span></button>
        <button data-section="summary"><svg class="ic"><use href="#i-chart"/></svg><span>Resumen</span></button>
        <button data-section="clients"><svg class="ic"><use href="#i-users"/></svg><span>Clientes</span></button>
        <button data-section="receivables"><svg class="ic"><use href="#i-inbox"/></svg><span>Cuentas por cobrar</span><b class="badge" data-badge="receivables" hidden></b></button>
        <button data-section="income"><svg class="ic"><use href="#i-wallet"/></svg><span>Ingresos</span></button>
        <button data-section="rates"><svg class="ic"><use href="#i-exchange"/></svg><span>Tipo de cambio</span></button>
        <button data-section="settings"><svg class="ic"><use href="#i-settings"/></svg><span>Configuración</span></button>
      </nav>
      <div class="sidebar-foot">
        <button class="side-link" id="backupStatus" data-action="goto" data-section="settings" title="Copia de seguridad"></button>
        <div class="side-row">
          <button class="btn-icon" id="themeToggle" data-action="theme-toggle" aria-label="Cambiar tema"></button>
          <button class="btn-icon" data-action="shortcuts" title="Atajos de teclado (?)" aria-label="Atajos de teclado"><svg class="ic"><use href="#i-keyboard"/></svg></button>
          <span class="local-note" title="Tus datos no salen de este navegador"><svg class="ic"><use href="#i-shield"/></svg>100% local</span>
        </div>
      </div>
    </aside>

    <main class="main" id="main">
      <div class="demo-banner" id="demoBanner" hidden></div>

      <section class="section sec-calendar" id="sec-calendar" aria-label="Calendario">
        <header class="toolbar">
          <div class="tb-row tb-main">
            <div class="tb-left">
              <div class="tb-nav">
                <button class="btn-icon" data-action="prev" title="Anterior (←)" aria-label="Anterior"><svg class="ic"><use href="#i-chevron-left"/></svg></button>
                <button class="btn-icon" data-action="next" title="Siguiente (→)" aria-label="Siguiente"><svg class="ic"><use href="#i-chevron-right"/></svg></button>
              </div>
              <h1 class="tb-title" id="calTitle"></h1>
              <button class="btn btn-ghost btn-now" data-action="now" title="Ir a ahora (T)"><svg class="ic"><use href="#i-clock"/></svg><span>Ir a ahora</span></button>
              <button class="btn-icon btn-search-toggle" data-action="toggle-search" aria-label="Buscar" title="Buscar"><svg class="ic"><use href="#i-search"/></svg></button>
            </div>
            <div class="tb-right">
              <div class="seg seg-cal" id="calFilterSeg" role="group" aria-label="Calendarios visibles">
                <button data-cal="work"><i class="dot dot-work"></i>Trabajo</button>
                <button data-cal="faculty"><i class="dot dot-fac"></i>Facultad</button>
                <button data-cal="both">Ambos</button>
              </div>
              <div class="seg seg-view" id="viewSeg" role="group" aria-label="Vista">
                <button data-view="week" title="Semana (W)">Semana</button>
                <button data-view="day" title="Día (D)">Día</button>
                <button data-view="agenda" title="Agenda de hoy (A)">Hoy</button>
              </div>
              <button class="btn btn-primary btn-new" data-action="new-event" title="Nuevo evento (N)"><svg class="ic"><use href="#i-plus"/></svg><span>Nuevo evento</span></button>
            </div>
          </div>
          <div class="tb-row tb-sub">
            <div class="search">
              <svg class="ic"><use href="#i-search"/></svg>
              <input id="searchInput" type="search" placeholder="Buscar eventos…" autocomplete="off" aria-label="Buscar eventos">
              <kbd class="search-kbd">/</kbd>
              <div class="search-results" id="searchResults" hidden></div>
            </div>
            <button class="btn btn-ghost btn-sm btn-filters" id="filtersBtn" data-action="filters" title="Filtros"><svg class="ic"><use href="#i-filter"/></svg><span>Filtros</span><b class="count"></b></button>
            <div class="active-filters" id="activeFilters" hidden></div>
            <span class="spacer"></span>
            <div class="zoom" role="group" aria-label="Zoom vertical">
              <button class="btn-icon" data-action="zoom-out" title="Menos alto (−)" aria-label="Alejar"><svg class="ic"><use href="#i-zoom-out"/></svg></button>
              <button class="btn-icon" data-action="zoom-in" title="Más alto (+)" aria-label="Acercar"><svg class="ic"><use href="#i-zoom-in"/></svg></button>
            </div>
            <button class="btn-icon btn-panel" data-action="toggle-panel" title="Mostrar u ocultar el resumen" aria-label="Panel de resumen"><svg class="ic"><use href="#i-panel"/></svg></button>
          </div>
        </header>
        <div class="print-head" id="printHead"></div>
        <div class="cal-layout">
          <div class="cal-main" id="calMain">
            <div class="daystrip" id="dayStrip" hidden></div>
            <div class="cal-grid-wrap" id="calGridWrap">
              <div class="cal-scroll" id="calScroll"><div class="cal-inner" id="calInner"></div></div>
            </div>
            <div class="agenda" id="agendaView" hidden></div>
          </div>
          <aside class="cal-panel" id="calPanel" aria-label="Resumen de la semana"></aside>
        </div>
      </section>

      <section class="section" id="sec-summary" aria-label="Resumen" hidden></section>
      <section class="section" id="sec-clients" aria-label="Clientes" hidden></section>
      <section class="section" id="sec-receivables" aria-label="Cuentas por cobrar" hidden></section>
      <section class="section" id="sec-income" aria-label="Ingresos" hidden></section>
      <section class="section" id="sec-rates" aria-label="Tipo de cambio" hidden></section>
      <section class="section" id="sec-settings" aria-label="Configuración" hidden></section>
    </main>

    <nav class="tabbar" aria-label="Navegación">
      <button data-section="calendar"><svg class="ic"><use href="#i-calendar"/></svg><span>Agenda</span></button>
      <button data-section="summary"><svg class="ic"><use href="#i-chart"/></svg><span>Resumen</span></button>
      <button data-section="clients"><svg class="ic"><use href="#i-users"/></svg><span>Clientes</span></button>
      <button data-section="receivables"><svg class="ic"><use href="#i-inbox"/></svg><span>Cobros</span><b class="badge" data-badge="receivables" hidden></b></button>
      <button data-action="more"><svg class="ic"><use href="#i-more"/></svg><span>Más</span></button>
    </nav>
    <button class="fab" data-action="new-event" aria-label="Nuevo evento"><svg class="ic"><use href="#i-plus"/></svg></button>
  </div>

  <div class="pop-backdrop" aria-hidden="true"></div>
  <div id="popover" class="popover" hidden></div>
  <aside id="drawer" class="drawer" hidden></aside>
  <div id="modalRoot"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="tip" class="tip" hidden></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>

  <script src="js/util.js"></script>
  <script src="js/store.js"></script>
  <script src="js/recurrence.js"></script>
  <script src="js/metrics.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/forms.js"></script>
  <script src="js/sections.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
